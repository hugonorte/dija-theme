services:
  db:
    image: mysql:8.0
    container_name: dija_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  wordpress:
    depends_on:
      - db
    # Versão exata: `docker compose pull` não troca o WordPress/PHP sem aviso.
    # Igual à produção (Hostinger): WordPress 7.1.5 + PHP 8.5. Ao atualizar lá, mude aqui.
    image: wordpress:7.1.5-php8.5-apache
    container_name: dija_wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_NAME: "DIJA - Blog"
    volumes:
      # Tema PHP (código-fonte direto, sem build)
      - ./wp-theme:/var/www/html/wp-content/themes/dija-theme
      # Uploads da biblioteca de mídia persistem entre recriações do container
      - wp_uploads:/var/www/html/wp-content/uploads

volumes:
  db_data:
  wp_uploads:
